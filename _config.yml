# GitHub Pages serves the privacy policy — App Store submissions need a real URL, and a
# public repo hosts one for free, with its revision history visible.
title: Starlapse
description: Long-exposure astrophotography for iPhone
theme: jekyll-theme-minimal
exclude:
  # Only PRIVACY.md (a redirect to starlapse.app/privacy/) is published. Builds from 20 Oct failed on
  # Liquid in docs/; the app's docs, the Astro site and the server are not Pages content.
  - docs
  - site
  - server
  - .claude
  - CLAUDE.md
  - Starlapse.xcodeproj
  - Starlapse.storekit
  - lefthook.yml
  - build-rel
  - Sources
  - Tests
  - tools
  - Makefile
  - Makefile.local.example
  - Package.swift
  - project.yml
  - build
  - build-sim
  - build-test
# Old pages redirect to their one canonical home (superduperai-site docs/ecosystem.md, step 4).
plugins:
  - jekyll-redirect-from
