name: Starlapse
options:
  bundleIdPrefix: co.superduperai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SkyKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode: full data-race checking. The camera and Metal layers are
    # written sendable-correct from the start rather than retrofitted.
    SWIFT_STRICT_CONCURRENCY: complete
    # Left empty on purpose — set TEAM in Makefile.local and the device build passes it
    # through. Keeps a team identifier out of a public repository.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Starlapse:
    type: application
    platform: iOS
    sources:
      - path: Sources/Starlapse
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SkyKit
        product: SkyKit
      - package: SkyKit
        product: StackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.starlapse
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_FAST_MATH: YES
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Shader source in the metallib, for the GPU debugger. Debug only: shipping it
          # bloats the bundle and hands out the source, and App Store Connect flags it.
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        release:
          MTL_ENABLE_DEBUG_INFO: NO
    info:
      path: Sources/Starlapse/App/Info.plist
      properties:
        CFBundleDisplayName: Starlapse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Upside-down is omitted deliberately: a phone on a tripod shooting the sky is
        # never held that way, and the sky overlay would have to handle a pose nobody uses.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - video-camera
          - gyroscope
          - magnetometer
        NSCameraUsageDescription: >-
          Starlapse needs the camera to capture long-exposure photographs of the night sky.
        NSPhotoLibraryAddUsageDescription: >-
          Starlapse saves your finished star stacks and time-lapses to your photo library.
        NSLocationWhenInUseUsageDescription: >-
          Your location and compass heading are used to compute where meteor shower radiants,
          the Moon and bright stars sit in the sky right now, so the app can point you at them.
        NSMotionUsageDescription: >-
          Device motion tells the app where the camera is aimed, so the sky overlay stays
          aligned with what you see. It works in complete darkness, unlike ARKit.
        # No UIBackgroundModes on purpose: iOS force-stops AVCaptureSession in the
        # background, so a background mode would buy nothing and only invite review
        # rejection. Long sessions stay alive via isIdleTimerDisabled + a dimmed screen.
        ITSAppUsesNonExemptEncryption: false

  StarlapseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StarlapseTests
    dependencies:
      - target: Starlapse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.starlapse.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Starlapse:
    build:
      targets:
        Starlapse: all
        StarlapseTests: [test]
    test:
      targets:
        - StarlapseTests
      gatherCoverageData: true
